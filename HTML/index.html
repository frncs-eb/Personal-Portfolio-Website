<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="../CSS/index.css">
    
    <title>CSIT 201 | Login & Registration</title>
</head>
<body>
 <div class="wrapper">
    <nav class="nav">
         <div class="nav-logo">
            <p>Portfolio.</p>
        </div>
        <div class="nav-menu" id="navMenu">
            <ul>
                <li><a href="#home" class="link active">Home</a></li>
                <li><a href="../HTML/blog.html" class="link">Blog</a></li>
                <li><a href="../HTML/services.html" class="link">Services</a></li>
                <li><a href="../HTML/about.html" class="link">About Us</a></li>
            </ul>
        </div>
        <div class="nav-button">
            <button class="btn white-btn" id="loginBtn">Sign In</button>
            <button class="btn" id="registerBtn" >Sign Up</button>
        </div>
        <div class="nav-menu-btn">
            <i class="bx bx-menu" id="menuToggle"></i>
        </div>
    </nav>

<!----------------------------- Form box ----------------------------------->    
    <div class="form-box">
        
        <!------------------- login form -------------------------->

        <div class="login-container" id="login">
        <form id="login-form" class="auth-form">
              <div class="top">
                <span>Don't have an account? <a href="#" id="goToRegister">Sign Up</a></span>
                <header>Login</header>
              
            </div>
            <div class="input-box">
                <input type="text" class="input-field" placeholder="Username or Email"required>
                <i class="bx bx-user"></i>
            </div>
            <div class="input-box">
                <input type="password" class="input-field" placeholder="Password"required>
                <i class="bx bx-lock-alt"></i>
            </div>
            <div class="input-box">
                <button type="submit" class="submit">Sign In</button>
            </div>
            <div class="two-col">
                <div class="one">
                    <input type="checkbox" id="login-check">
                    <label for="login-check"> Remember Me</label>
                </div>
                <div class="two">
                    <label><a href="#">Forgot password?</a></label>
                </div>
            </div>
        </form>
        </div>

        <!------------------- registration form -------------------------->
        <div class="register-container" id="register">
          <form id="register-form" class="auth-form">
            <div class="top">
                <span>Have an account? <a href="#" id="goToLogin">Login</a></span>
                <header>Sign Up</header>
            </div>
            <div class="two-forms">
                <div class="input-box">
                    <input type="text" class="input-field" placeholder="Firstname"required>
                    <i class="bx bx-user"></i>
                </div>
                <div class="input-box">
                    <input type="text" class="input-field" placeholder="Lastname"required>
                    <i class="bx bx-user"></i>
                </div>
            </div>
            <div class="input-box">
                <input type="text" class="input-field" placeholder="Email"required>
                <i class="bx bx-envelope"></i>
            </div>
            <div class="input-box">
                <input type="password" class="input-field" placeholder="Password"required>
                <i class="bx bx-lock-alt"></i>
            </div>
            <div class="input-box">
                <button type="submit" class="submit" >Register</button>
            </div>
            <div class="two-col">
                <div class="one">
                    <input type="checkbox" id="register-check">
                    <label for="register-check"> Remember Me</label>
                </div>
                <div class="two">
                    <label><a href="#">Terms & conditions</a></label>
                </div>
            </div>
          </form>
        </div>
    </div>

</div>   
<script src="../JAVSCRIPT/index.js" defer=""></script>

</body>
</html>
